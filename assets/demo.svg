<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradNexus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadowNexus" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF007A" flood-opacity="0.2"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .terminal-text {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .c-dim { fill: #6E7681; }
      .c-white { fill: #F0F6FC; }
      .c-pink { fill: #FF007A; font-weight: 700; }
      .c-purple { fill: #A855F7; font-weight: 600; }
      .c-cyan { fill: #00F0FF; font-weight: 600; }
      .c-green { fill: #00FF66; font-weight: 600; }
      .c-yellow { fill: #FFBD2E; font-weight: 600; }

      @keyframes cycleAnim {
        0% { opacity: 0; transform: translateY(4px); }
        3% { opacity: 1; transform: translateY(0); }
        92% { opacity: 1; transform: translateY(0); }
        98% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s infinite;
        fill: #FF007A;
      }

      .anim-l0 { animation: cycleAnim 13s ease infinite; animation-delay: 0.1s; }
      .anim-l1 { animation: cycleAnim 13s ease infinite; animation-delay: 1.0s; }
      .anim-l2 { animation: cycleAnim 13s ease infinite; animation-delay: 2.1s; }
      .anim-l3 { animation: cycleAnim 13s ease infinite; animation-delay: 3.2s; }
      .anim-l4 { animation: cycleAnim 13s ease infinite; animation-delay: 4.4s; }
      .anim-l5 { animation: cycleAnim 13s ease infinite; animation-delay: 5.5s; }
      .anim-l6 { animation: cycleAnim 13s ease infinite; animation-delay: 6.7s; }
      .anim-l7 { animation: cycleAnim 13s ease infinite; animation-delay: 7.8s; }
      .anim-l8 { animation: cycleAnim 13s ease infinite; animation-delay: 8.9s; }
      .anim-l9 { animation: cycleAnim 13s ease infinite; animation-delay: 10.0s; }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="10" y="10" width="860" height="450" rx="12" ry="12" fill="#0D0A14" stroke="#FF007A" stroke-width="1.5" stroke-opacity="0.5" filter="url(#shadowNexus)"/>

  <!-- Titlebar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 46 L 10 46 Z" fill="#181022"/>
  <line x1="10" y1="46" x2="870" y2="46" stroke="#2B1D3D" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="32" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="28" r="6" fill="#27C93F"/>

  <!-- Title text -->
  <text x="440" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" font-weight="500">
    benni-nexus — intelligent LLM router &amp; telemetry gateway — 860x450
  </text>

  <!-- Terminal Content -->
  <g class="terminal-text" transform="translate(30, 80)">
    
    <!-- Line 0: Command Invocation -->
    <g class="anim-l0">
      <text x="0" y="0">
        <tspan class="c-pink">❯ </tspan>
        <tspan class="c-purple">benni-nexus</tspan>
        <tspan class="c-white"> start </tspan>
        <tspan class="c-dim">--strategy cheap-first --failover --port 4000</tspan>
      </text>
    </g>

    <!-- Line 1: Header banner -->
    <g class="anim-l1" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan class="c-dim">[NEXUS GATEWAY]</tspan>
        <tspan class="c-pink"> Benni Nexus v1.1.0 Active</tspan>
        <tspan class="c-dim"> — Listening on 0.0.0.0:4000</tspan>
      </text>
    </g>

    <!-- Line 2: Multi-backend mesh -->
    <g class="anim-l2" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan class="c-cyan">● BACKEND MESH:</tspan>
        <tspan class="c-green"> 4 Providers Health Checked </tspan>
        <tspan class="c-dim">(Ollama Local, Groq Fast, OpenAI, Anthropic)</tspan>
      </text>
    </g>

    <!-- Line 3: Routing decision -->
    <g class="anim-l3" transform="translate(0, 80)">
      <text x="0" y="0">
        <tspan class="c-dim">[REQUEST] POST /v1/chat/completions </tspan>
        <tspan class="c-white">from LangChain Client</tspan>
      </text>
    </g>

    <!-- Line 4: Strategy execution -->
    <g class="anim-l4" transform="translate(0, 114)">
      <text x="0" y="0">
        <tspan class="c-purple">● ROUTING STRATEGY:</tspan>
        <tspan class="c-yellow"> 'cheap-first' active</tspan>
        <tspan class="c-dim"> → Evaluated task complexity: </tspan>
        <tspan class="c-green">ROUTED TO LOCAL OLLAMA</tspan>
      </text>
    </g>

    <!-- Line 5: Latency and cost metric -->
    <g class="anim-l5" transform="translate(0, 138)">
      <text x="0" y="0">
        <tspan class="c-green">✔ Token Stream:</tspan>
        <tspan class="c-white"> 48.2 tok/s </tspan>
        <tspan class="c-dim">| TTFT: </tspan><tspan class="c-green">62ms</tspan>
        <tspan class="c-dim"> | Cost: </tspan><tspan class="c-green">$0.000000 (100% Free Local GPU)</tspan>
      </text>
    </g>

    <!-- Line 6: Automatic failover -->
    <g class="anim-l6" transform="translate(0, 172)">
      <text x="0" y="0">
        <tspan class="c-cyan">● FAILOVER CIRCUIT:</tspan>
        <tspan class="c-white"> Zero downtime policy </tspan>
        <tspan class="c-dim">(If local model OOMs → instant fallback to Groq in &lt;15ms)</tspan>
      </text>
    </g>

    <!-- Line 7: Daily token telemetry -->
    <g class="anim-l7" transform="translate(0, 196)">
      <text x="0" y="0">
        <tspan class="c-dim">[TELEMETRY] 24h Spend Saved: </tspan>
        <tspan class="c-green">+$48.30</tspan>
        <tspan class="c-dim"> | Request Reliability: </tspan><tspan class="c-green">99.99%</tspan>
      </text>
    </g>

    <!-- Line 8: Verdict -->
    <g class="anim-l8" transform="translate(0, 230)">
      <text x="0" y="0">
        <tspan class="c-white">Gateway Verdict: </tspan>
        <tspan class="c-pink">SOVEREIGN AI ROUTING</tspan>
        <tspan class="c-dim"> | One endpoint. All models. Zero lock-in.</tspan>
      </text>
    </g>

    <!-- Line 9: Ready prompt -->
    <g class="anim-l9" transform="translate(0, 260)">
      <text x="0" y="0">
        <tspan class="c-pink">❯ </tspan>
        <tspan class="c-dim">benni-nexus healthy. Forwarding completions.</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>

  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="10" y="457" width="860" height="3" fill="url(#headerGradNexus)" rx="1.5"/>
</svg>
